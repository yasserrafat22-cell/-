name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "عنوان سيرفر التجربة داخل APK (مثال: http://192.168.1.50:5080)"
        required: false
        default: "http://10.0.2.2:5080"

permissions:
  contents: read

jobs:
  server:
    name: Server (.NET + PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qadisiyah
          POSTGRES_PASSWORD: qadisiyah_dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qadisiyah"
          --health-interval 5s --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      QADISIYAH_TEST_DB: Host=localhost;Port=5432;Database=qadisiyah_test;Username=qadisiyah;Password=qadisiyah_dev
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  app:
    name: App (Flutter analyze + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: golden-failures
          path: app/test/**/failures/

  android:
    name: Android APK (debug build for testing)
    runs-on: ubuntu-24.04
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - run: flutter pub get
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'http://10.0.2.2:5080' }}
        run: |
          if ! [[ "$API_BASE_URL" =~ ^https?://[A-Za-z0-9.:-]+/?$ ]]; then
            echo "api_base_url غير صالح: $API_BASE_URL" >&2
            exit 1
          fi
          # رقم الإصدار يزيد مع كل تشغيل حتى يُثبَّت كل APK فوق السابق.
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))
          echo "API_BASE_URL=$API_BASE_URL BUILD_NUMBER=$BUILD_NUMBER"
          flutter build apk --debug --build-number="$BUILD_NUMBER" --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v5
        with:
          name: qadisiyah-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  trial-server:
    name: Trial server image (Docker + login smoke test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/trial
    steps:
      - uses: actions/checkout@v5
      - name: Start with the one-command script
        run: ./start-trial.sh 127.0.0.1
      - name: Login with bootstrap admin requires password change
        run: |
          set -a; . ./.env; set +a
          body=$(curl -sf -X POST http://127.0.0.1:5080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$BOOTSTRAP_ADMIN_PASSWORD\",\"deviceId\":\"$(cat /proc/sys/kernel/random/uuid)\",\"deviceName\":\"ci\"}")
          echo "$body" | python3 -c "import json,sys; u=json.load(sys.stdin)['user']; assert u['mustChangePassword'] is True; print('ok', u['username'])"
      - name: Database is not exposed
        run: |
          ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null
      - if: always()
        run: docker compose down -v

  trial-scripts-windows:
    name: Trial scripts (Windows PowerShell syntax)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse start/stop scripts
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in 'deploy/trial/start-trial.ps1', 'deploy/trial/stop-trial.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "${f}: $_" }; $failed = $true }
            else { Write-Host "$f OK" }
          }
          if ($failed) { exit 1 }
